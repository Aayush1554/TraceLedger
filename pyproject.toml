[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceledger"
version = "0.2.0"
description = "Explainable AML monitoring, transaction network analysis, and financial investigations."
readme = "README.md"
license = "MIT"
authors = [{ name = "Aayush Hudda" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "Flask>=3.0,<4.0",
]
keywords = ["aml", "anti-money-laundering", "transaction-monitoring", "fintech", "compliance", "anomaly-detection", "investigations"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
traceledger = "traceledger.cli:main"

[tool.setuptools.packages.find]
include = ["traceledger*"]

[tool.setuptools.package-data]
traceledger = ["templates/*.html", "static/*.css"]

[tool.ruff]
line-length = 105
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
